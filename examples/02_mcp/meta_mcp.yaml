# yaml-language-server: $schema=../../../schemas/model_config_schema.json
#
# Demonstrates two MCP features in dao-ai:
#   1. `genie: true`  — Genie One MCP (system.ai.genie_one_mcp on the Unity AI
#                       Gateway; workspace-wide, no space_id). Replaces the Beta
#                       /api/2.0/mcp/genie endpoint (sunset 2026-10-31).
#   2. `meta: {...}`  — per-MCP-server `_meta` parameters (MCP spec)
#
# Deploys cleanly to a fresh workspace with minimal pre-provisioned resources.
# Genie One runs on behalf of the calling user (OBO, `ai-gateway` scope); the
# DBSQL MCP server uses the app / endpoint identity.
#
# Required parameter (works for both Databricks Apps and Model Serving):
#   dao-ai agent up -c meta_mcp.yaml -p <profile> --param warehouse_id=<id> [-m model_serving]

# =============================================================================
# PARAMETERS
# =============================================================================
parameters:
  warehouse_id:
    description: SQL warehouse ID pinned via `_meta` on DBSQL MCP calls (required).
  catalog:
    description: Unity Catalog catalog name
    default: retail_consumer_goods
  schema:
    description: Schema within the catalog
    default: dao_ai_meta_mcp
  llm:
    description: Chat/reasoning serving endpoint for the agent.
    default: databricks-claude-sonnet-5

schemas:
  registry_schema: &registry_schema
    catalog_name: ${var.catalog}
    schema_name: ${var.schema}

resources:
  models:
    default_llm: &default_llm
      name: ${var.llm}

# In-memory checkpointer: follow-up turns that send the same thread_id continue
# the Genie One conversation (its id lives in the checkpointed session state).
memory: &memory
  checkpointer:
    name: default_checkpointer                         # in-memory (no database)

tools:
  # Feature 1: Genie One MCP (`genie: true`)
  genie_all_mcp: &genie_all_mcp
    name: genie_all_mcp
    function:
      type: mcp
      genie: true                                      # system.ai.genie_one_mcp via Unity AI Gateway
      on_behalf_of_user: true                          # answer as the calling user (ai-gateway scope)
      # Tools: genie_ask, genie_poll_response, genie_get_query_result,
      # genie_cancel_response. dao-ai keeps the Genie conversation_id in
      # session.genie.spaces.genie_one so follow-up questions continue it.

  # Feature 2: DBSQL MCP with `_meta.warehouse_id` (the new `meta` field)
  sql_mcp_with_meta: &sql_mcp_with_meta
    name: sql_mcp_with_meta
    function:
      type: mcp
      sql: true                                        # serverless DBSQL MCP
      meta:                                            # NEW: per-call _meta sent on every tools/call
        warehouse_id: ${var.warehouse_id}              # pin a specific SQL warehouse
      # Use the app's own service principal (auto-injected by Databricks Apps).

agents:
  meta_mcp_agent: &meta_mcp_agent
    name: meta_mcp_agent
    model: *default_llm
    tools:
    - *genie_all_mcp
    - *sql_mcp_with_meta
    prompt: |
      You are a Databricks data assistant for end-to-end validation of two new MCP
      capabilities in dao-ai:

        1. `genie_all_mcp` — Genie One MCP server that can query any
           Genie space in the workspace (no space_id needed).
        2. `sql_mcp_with_meta` — the DBSQL MCP server with a pinned `warehouse_id`
           injected via the `_meta` parameter.

      When the user asks a SQL question, use `sql_mcp_with_meta` and call
      `execute_sql`. When the user asks a natural-language data question, use
      Genie One: call `genie_ask` with the question, then call
      `genie_poll_response` with the returned conversation_id and response_id
      until its status is `completed`, then answer from its final answer and
      include the "Explore in Databricks" link. For a follow-up question, call
      `genie_ask` again without a conversation_id; the conversation is
      continued automatically. Be concise.

app:
  name: dao_ai_meta_mcp
  log_level: TRACE
  registered_model:
    schema: *registry_schema
    name: dao_ai_meta_mcp
  agents:
  - *meta_mcp_agent
  orchestration:
    memory: *memory                                    # thread_id-scoped checkpointer
